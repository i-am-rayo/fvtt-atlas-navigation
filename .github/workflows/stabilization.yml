name: Stabilization checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: stabilization-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  architecture-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the module
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Verify internal imports and dependency boundaries
        run: npm run architecture:check
  node-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the module
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Check syntax and run tests
        run: npm run check
